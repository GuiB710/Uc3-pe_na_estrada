{% extends "_base.html" %}
{% load static %}

{% block title %}Categoria | Pé na Estrada{% endblock %}

{% block content %}
    <table class="table table-dark table-striped">
        <thead class="table-warning">
            <th>Nome</th>
            <th>Descrição</th>
        </thead>
        <tbody>
        {% for categoria in categorias %}
            <tr>
                <td> {{ categoria.nome }} </td>
                <td> {{ categoria.descricao }} </td>
            </tr>
        {% empty %} 
            <tr> Não há produtos cadastrados </tr>
        {% endfor %}
        </tbody>
    </table>
{% endblock %}
